{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">
            <img src="{{ product.image.url}}" class="img-fluid rounded">
        </div>

        <div class="col-md-6">

            <h2>{{ product.name }}</h2>

            <h5 class="text-danger mt-3">
                {{ product.price }} تومان
            </h5>

            <p class="mt-3">
                برند: مانتو خاکستری
            </p>

            <a href="{% url 'cart_add' product.id %}" class="btn btn-danger">
                افزودن به سبد خرید
            </a>

        </div>

    </div>

</div>

{% endblock %}
