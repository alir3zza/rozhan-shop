<form method="POST">
    {% csrf_token %}

    <div class="form-group">
        <label>نام و نام خانوادگی</label>
        <input type="text" name="name" placeholder="مثال: سارا محمدی" required>
    </div>

    <div class="form-group">
        <label>ایمیل</label>
        <input type="email" name="email" placeholder="example@gmail.com" required>
    </div>

    <div class="form-group">
        <label>شماره تماس</label>
        <input type="text" name="phone" placeholder="09121234567" required>
    </div>

    <div class="form-group">
        <label>موضوع</label>
        <select name="subject">
            <option value="">انتخاب کنید...</option>
            <option>سفارش و خرید</option>
            <option>پشتیبانی</option>
            <option>مشاوره استایل</option>
            <option>پیشنهاد همکاری</option>
            <option>سایر</option>
        </select>
    </div>

    <div class="form-group">
        <label>پیام</label>
        <textarea name="message" placeholder="متن پیام..." rows="6" required></textarea>
    </div>

    <button class="btn-submit" type="submit">ارسال پیام</button>
</form>
