{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
        }

        .login-box{

            width:400px;
            margin:80px auto;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,.1);

        }

    </style>

</head>
<body>

<div class="login-box">

    <h3 class="text-center mb-4">
        ورود به حساب
    </h3>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary w-100">

            ورود

        </button>

    </form>

    <hr>

    <a href="{% url 'register' %}" class="btn btn-success w-100">

        ثبت نام

    </a>

</div>

</body>
</html>
